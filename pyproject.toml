[project]
name = "music-organizer"
version = "0.0.1"
description = "Backend into the music organizer add-on"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy >= 1.26.4",
    "sqlite3 >= 3.14.3",
    "fastapi[standard]",
    "py7zr",
    "pyparsing"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
log_format = "%(asctime)s %(levelname)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_cli = true
log_cli_level = "DEBUG"
addopts = "-s"